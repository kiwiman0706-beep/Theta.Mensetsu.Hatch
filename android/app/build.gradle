plugins { id 'com.android.application' }

// Signing: SIGNING_FILE / SIGNING_PASSWORD (CI secrets), else the shared development key in
// android/signing/ (see android/README.md). The SHA-1 of the key is what Google Cloud's Android
// OAuth client names; the app shows it in its setup guide.
def signFile = System.getenv('SIGNING_FILE') ?: file('../signing/mensetsu-dev.jks').path
def signPass = System.getenv('SIGNING_PASSWORD') ?: 'mensetsu-dev'
def signAlias = System.getenv('SIGNING_ALIAS') ?: 'mensetsu'

android {
    namespace 'jp.yaegaki.theta.mensetsu'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'jp.yaegaki.theta.mensetsu'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        app {
            storeFile file(signFile)
            storePassword signPass
            keyAlias signAlias
            keyPassword signPass
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.app }
        release {
            signingConfig signingConfigs.app
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    // The shared screen and backend are built by web/ (npm run build:android) into assets/www.
    androidResources { noCompress += ['mjs', 'bcmap', 'pfb', 'ttf'] }
}

tasks.register('checkWebAssets') {
    doLast {
        if (!file('src/main/assets/www/index.html').exists())
            throw new GradleException("assets/www is missing: run `npm run build:android` in web/ first")
    }
}
preBuild.dependsOn checkWebAssets

dependencies {
    // One Kotlin standard library for all AndroidX / Play services parts (else duplicate classes).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
