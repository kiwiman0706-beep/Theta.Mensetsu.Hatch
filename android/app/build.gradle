plugins { id 'com.android.application' }

// Signing: the series' shared key from the repository secrets (Theta.Hatch.Series secrets/README.md):
// ANDROID_KEYSTORE_B64 is decoded by the workflow into SIGNING_FILE; ANDROID_KEYSTORE_PASSWORD,
// ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD come straight from the secrets. Without them a release
// build is not signed (a local debug build uses Android's debug key).
def signFile = System.getenv('SIGNING_FILE')
def hasKey = signFile && file(signFile).exists()

android {
    namespace 'app.thetahatch.mensetsu'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'app.thetahatch.mensetsu'
        minSdk 26
        targetSdk 35
        versionCode 102
        versionName '1.0.2'
    }
    signingConfigs {
        if (hasKey) {
            series {
                storeFile file(signFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasKey) signingConfig signingConfigs.series
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    // The shared screen and backend are built by web/ (npm run build:android) into assets/www.
    androidResources { noCompress += ['mjs', 'bcmap', 'pfb', 'ttf'] }
}

tasks.register('checkWebAssets') {
    doLast {
        if (!file('src/main/assets/www/index.html').exists())
            throw new GradleException("assets/www is missing: run `npm run build:android` in web/ first")
    }
}
preBuild.dependsOn checkWebAssets

dependencies {
    // One Kotlin standard library for all AndroidX / Play services parts (else duplicate classes).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
