# The browser version (PWA) on GitHub Pages: https://kiwiman0706-beep.github.io/Theta.Mensetsu.Hatch/
# Built from web/ (with the shared UI in ui/ and the backend in desktop/lib) on every push to main.
# Needs Settings → Pages → Source: "GitHub Actions" (once); then Actions → this workflow → Re-run.
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "web/**"
      - "desktop/lib/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Desktop libraries (shared with the web version)
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Test and build
        working-directory: web
        run: npm ci && npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
