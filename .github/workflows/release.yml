# A release: bump the version in desktop/ and web/package.json and android/app/build.gradle, add
# docs/releases/v<version>.md and push to main (or push a tag like v0.1.0, or run it by hand).
# → tests, then the Android APK, the Windows installer and the Mac builds, published together as
# one GitHub Release with the tag v<version> (the PC app checks it for updates).
# The APK is signed with the repository secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS when set, else with the development key in android/signing/.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["docs/releases/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag, desktop and web versions agree
        run: |
          desktop="$(node -p 'require("./desktop/package.json").version')"
          web="$(node -p 'require("./web/package.json").version')"
          android="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$desktop"; fi
          echo "tag=$tag desktop=$desktop web=$web android=$android"
          test "$tag" = "$desktop" && test "$tag" = "$web" && test "$tag" = "$android"
          test -f "docs/releases/v$tag.md"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Desktop tests
        working-directory: desktop
        run: npm ci --ignore-scripts && npm test
      - name: Web version (unit, build)
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Screens (Chromium)
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node desktop/test/e2e/ui.e2e.cjs
          NODE_PATH="$(npm root -g)" node web/test/e2e.cjs
          (cd web && npm run build:android)
          NODE_PATH="$(npm root -g)" node android/tests/page.e2e.cjs

  android:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Page for the app (shared screen + backend)
        working-directory: web
        run: npm ci && npm run build:android
      - name: APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_FILE="$RUNNER_TEMP/release.jks" SIGNING_PASSWORD="$KEYSTORE_PASSWORD" SIGNING_ALIAS="${KEY_ALIAS:-mensetsu}"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: the APK is signed with the development key (android/signing/)"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ThetaMensetsuHatch-${{ needs.check.outputs.version }}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/*.apk | grep SHA-1
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/out/*.apk
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Installer and zip
        working-directory: desktop
        run: npm ci && npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/*.zip
            desktop/dist/latest.yml
          if-no-files-found: error

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: dmg and zip (Apple silicon and Intel)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm ci && npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [check, android, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ls -la out
          # Re-running (e.g. after adding the signing secrets) adds or replaces the files.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            # Run by hand, the tag is created on this commit.
            gh release create "$TAG" out/* \
              --target "$GITHUB_SHA" \
              --title "Theta Mensetsu Hatch ${{ needs.check.outputs.version }}" \
              --notes-file "docs/releases/$TAG.md"
          fi
